<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUAN XITER - @ru4n_xq</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: radial-gradient(circle at center, #0a0a0a 0%, #000000 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            image-rendering: crisp-edges;
        }
        
        #panel {
            width: 840px;
            height: 640px;
            background: linear-gradient(180deg, #0f0f0f 0%, #000 100%);
            border: 8px solid #00ff41;
            border-radius: 12px;
            box-shadow: 
                0 0 60px #00ff41aa,
                inset 0 0 45px rgba(0,255,65,0.2),
                0 0 120px rgba(0,0,0,0.98);
            position: relative;
            overflow: hidden;
            color: #00ff41;
            text-shadow: 0 0 10px #00ff41;
            transition: all 0.4s ease;
        }
        
        .hidden { transform: translateY(-150%); opacity: 0; }
        
        .header {
            text-align: center;
            font-size: 38px;
            letter-spacing: 8px;
            padding: 15px;
            background: rgba(0,0,0,0.9);
            border-bottom: 6px solid #00ff41;
            text-transform: uppercase;
            position: relative;
        }
        
        .hide-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            background: #ff0044;
            color: #fff;
            border: 4px solid #ff0044;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Press Start 2P';
            transition: all 0.25s;
        }
        
        .hide-btn:hover { background: #fff; color: #ff0044; transform: scale(1.05); }
        
        .buttons {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin: 25px 0;
        }
        
        .btn {
            padding: 18px 40px;
            font-size: 20px;
            font-family: 'Press Start 2P';
            text-transform: uppercase;
            border: 5px solid #00ff41;
            background: #000;
            color: #00ff41;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 30px #00ff41;
            min-width: 260px;
        }
        
        .btn:hover {
            transform: scale(1.1);
            background: #00ff41;
            color: #000;
            box-shadow: 0 0 60px #00ff41;
        }
        
        .inject-btn {
            background: #ff0000;
            border-color: #ff0000;
            color: #fff;
            animation: pulse 1.8s infinite;
        }
        
        @keyframes pulse {
            0%,100% { box-shadow: 0 0 25px #ff0000; }
            50% { box-shadow: 0 0 60px #ff0000; }
        }
        
        .status {
            background: #000;
            border: 6px solid #00ff41;
            padding: 16px;
            text-align: center;
            font-size: 20px;
            margin: 0 30px 25px;
            min-height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 30px #00ff41;
            letter-spacing: 2px;
        }
        
        .success { animation: glow 1.3s infinite alternate; }
        
        @keyframes glow {
            from { text-shadow: 0 0 12px #00ff41; }
            to { text-shadow: 0 0 40px #00ff41, 0 0 70px #00ff41; }
        }
        
        .section {
            background: rgba(10,10,10,0.95);
            border: 5px solid #00ff41;
            margin: 0 30px 20px;
            padding: 20px;
        }
        
        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 4px;
        }
        
        .locks-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        
        .lock-item {
            background: rgba(25,25,25,0.9);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 3px solid #444;
            font-size: 16px;
        }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 75px;
            height: 36px;
        }
        
        .switch input { opacity: 0; width: 0; height: 0; }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #222;
            border: 3px solid #00ff41;
            border-radius: 36px;
            transition: .4s;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 5px;
            bottom: 3px;
            background: #fff;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .slider { background: #00ff41; }
        
        input:checked + .slider:before {
            transform: translateX(39px);
            background: #000;
        }
        
        .sliders-grid {
            display: grid;
            gap: 16px;
        }
        
        .slider-container {
            display: flex;
            align-items: center;
            gap: 18px;
            background: rgba(20,20,20,0.9);
            padding: 14px 20px;
            border: 3px solid #444;
        }
        
        .slider-label { width: 120px; font-size: 16px; }
        
        .range { flex: 1; accent-color: #00ff41; height: 10px; cursor: pointer; }
        
        .value {
            background: #000;
            border: 3px solid #00ff41;
            padding: 8px 16px;
            font-size: 20px;
            min-width: 80px;
            text-align: center;
        }
        
        .footer {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 15px;
            opacity: 0.9;
            letter-spacing: 1px;
        }
        
        .scanline {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(transparent 50%, rgba(0,255,65,0.04) 50%);
            background-size: 100% 10px;
            pointer-events: none;
            animation: scan 4s linear infinite;
            z-index: 5;
            opacity: 0.18;
        }
        
        @keyframes scan { 0% { transform: translateY(-150%); } 100% { transform: translateY(350%); } }
    </style>
</head>
<body>
    <div id="panel">
        <div class="scanline"></div>
        
        <div class="header">
            RUAN XITER
            <button class="hide-btn" id="hide-btn">ESCONDER PAINEL</button>
        </div>
        
        <div class="buttons">
            <button id="start-btn" class="btn">INICIAR FREE FIRE</button>
            <button id="inject-btn" class="btn inject-btn">INJETAR</button>
        </div>
        
        <div id="status" class="status">
            STATUS: AGUARDANDO INJEÇÃO
        </div>
        
        <div class="section">
            <div class="section-title">AIMLOCKS</div>
            <div class="locks-grid">
                <div class="lock-item">
                    <span>HEADLOCK</span>
                    <label class="switch">
                        <input type="checkbox" id="headlock">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="lock-item">
                    <span>NECKLOCK</span>
                    <label class="switch">
                        <input type="checkbox" id="necklock">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="lock-item">
                    <span>CHESTLOCK</span>
                    <label class="switch">
                        <input type="checkbox" id="chestlock">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">AJUSTE DE HS</div>
            <div class="sliders-grid">
                <div class="slider-container">
                    <span class="slider-label">CABEÇA</span>
                    <input type="range" id="head" class="range" min="0" max="100" value="88">
                    <span id="head-val" class="value">88%</span>
                </div>
                <div class="slider-container">
                    <span class="slider-label">PESCOÇO</span>
                    <input type="range" id="neck" class="range" min="0" max="100" value="75">
                    <span id="neck-val" class="value">75%</span>
                </div>
                <div class="slider-container">
                    <span class="slider-label">PEITO</span>
                    <input type="range" id="chest" class="range" min="0" max="100" value="65">
                    <span id="chest-val" class="value">65%</span>
                </div>
            </div>
        </div>
        
        <div class="footer">
            @ru4n_xq
        </div>
    </div>

    <script>
        const panel = document.getElementById('panel');
        const status = document.getElementById('status');
        const injectBtn = document.getElementById('inject-btn');
        const startBtn = document.getElementById('start-btn');
        const hideBtn = document.getElementById('hide-btn');
        
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        const ranges = document.querySelectorAll('input[type="range"]');
        
        let injected = false;
        
        function resetStatus() {
            if (injected) {
                status.innerHTML = 'STATUS: <span style="color:#ff4444">CONFIG ALTERADA - REINJETAR</span>';
                injected = false;
            }
        }
        
        // Atualiza valores dos sliders
        ranges.forEach(range => {
            const valEl = document.getElementById(range.id + '-val');
            valEl.textContent = range.value + '%';
            range.addEventListener('input', () => {
                valEl.textContent = range.value + '%';
                resetStatus();
            });
        });
        
        // Qualquer mudança reseta status
        checkboxes.forEach(cb => cb.addEventListener('change', resetStatus));
        
        // Iniciar Free Fire (simulação)
        startBtn.addEventListener('click', () => {
            startBtn.textContent = 'FREE FIRE INICIADO ✓';
            startBtn.style.background = '#00ff41';
            startBtn.style.color = '#000';
            setTimeout(() => {
                startBtn.textContent = 'INICIAR FREE FIRE';
                startBtn.style.background = '#000';
                startBtn.style.color = '#00ff41';
            }, 1800);
        });
        
        // Injetar com animação
        injectBtn.addEventListener('click', () => {
            if (injectBtn.disabled) return;
            injectBtn.disabled = true;
            injectBtn.textContent = 'INJETANDO CÓDIGOS...';
            injectBtn.style.background = '#ffff00';
            injectBtn.style.color = '#000';
            
            setTimeout(() => {
                injectBtn.textContent = 'CÓDIGOS INJETADOS COM SUCESSO!';
                status.innerHTML = 'STATUS: <span class="success">INJETADO ✓ ATIVO</span>';
                injected = true;
                
                setTimeout(() => {
                    injectBtn.disabled = false;
                    injectBtn.textContent = 'INJETAR';
                    injectBtn.style.background = '#ff0000';
                    injectBtn.style.color = '#fff';
                }, 2200);
            }, 2500);
        });
        
        // Esconder / Mostrar painel (para gravação clean)
        let hidden = false;
        hideBtn.addEventListener('click', () => {
            hidden = !hidden;
            panel.classList.toggle('hidden', hidden);
            hideBtn.textContent = hidden ? 'MOSTRAR PAINEL' : 'ESCONDER PAINEL';
        });
        
        console.log('%cRUAN XITER @ru4n_xq - Painel carregado!', 'color:#00ff41; font-size:16px; font-family:monospace');
    </script>
</body>
  </html>
